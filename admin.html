<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/base.css">
<link rel="stylesheet" href="/assets/site.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%231F44D6%27/%3E%3Crect x=%279%27 y=%2724%27 width=%2717%27 height=%272%27 rx=%271%27 fill=%27%23E0303A%27/%3E%3C/svg%3E">
<title>Панель автора — ИИ. Полный доступ</title><meta name="robots" content="noindex">
</head><body>
<header class="top"><div class="wrap top-in"><a class="brand" href="/"><span class="brand-mark">ИИ</span><span class="brand-t">Полный доступ</span></a></div></header>
<main class="adm" id="adm">
  <div class="page-h"><span class="eyebrow">Панель автора</span><h1 class="l-title" style="margin:0">Продажи и ключи</h1></div>
  <form class="paywall" id="auth" style="max-width:520px"><label class="field"><span>Пароль администратора</span><input class="inp" type="password" id="pw" autocomplete="current-password"></label><p class="err" id="ae"></p><button class="btn" type="submit">Войти</button></form>
  <div id="out"></div>
</main>
<script src="/assets/kit.js"></script>
<script>
(function(){
  const {$, esc, rub} = K;
  const q = new URLSearchParams(location.search);
  let pw = q.get('secret') || sessionStorage.getItem('adm') || '';
  const src = {yookassa:'ЮKassa', manual:'Выдан вручную', demo:'Тест', test:'Тест'};
  async function load(){
    try {
      const r = await K.api('admin?secret=' + encodeURIComponent(pw));
      try { sessionStorage.setItem('adm', pw); } catch (e) {}
      $('#auth').hidden = true; const s = r.stats;
      $('#out').innerHTML = '<div class="pr-tiles"><div class="tile"><span>Оплат через ЮKassa</span><b>' + s.paid + '</b></div><div class="tile"><span>Выручка</span><b>' + rub(s.revenue) + '</b></div><div class="tile"><span>Ключей выдано вручную</span><b>' + s.manual + '</b></div><div class="tile"><span>Режим оплаты</span><b style="font-size:1.2rem">' + ({live:'ЮKassa, боевой', demo:'Тестовый', off:'Выключен'}[r.mode]) + '</b></div></div>'
        + '<form class="dash" id="kf"><div class="dash-head"><span class="eyebrow">Выдать доступ</span><b>Ключи для учеников, партнёров, подарков</b></div><div class="key-form"><select class="inp" id="kt" style="flex:0 1 260px">' + r.tariffs.map(t => '<option value="' + t.id + '">' + esc(t.name) + '</option>').join('') + '</select><input class="inp" id="kn" type="number" min="1" max="50" value="1" style="flex:0 1 110px" aria-label="Количество"><button class="btn" type="submit">Создать ключи</button></div><div id="keys"></div></form>'
        + '<div class="dash"><div class="dash-head"><span class="eyebrow">Последние заказы</span><b>50 последних</b></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Дата</th><th>Тариф</th><th>Сумма</th><th>Статус</th><th>Источник</th><th>Ключ</th></tr></thead><tbody>'
        + (s.recent.map(o => '<tr><td class="num">' + new Date(o.created_at).toLocaleString('ru-RU') + '</td><td>' + esc(o.tariff) + '</td><td class="num">' + rub(o.amount) + '</td><td>' + ({paid:'<span class="acc acc-open">Оплачен</span>', pending:'<span class="acc acc-pay">Ожидает</span>', canceled:'<span class="acc acc-ru">Отменён</span>'}[o.status] || esc(o.status)) + '</td><td>' + (src[o.source] || esc(o.source)) + '</td><td><code>' + (o.status === 'paid' ? esc(o.access_key) : '—') + '</code></td></tr>').join('') || '<tr><td colspan="6" class="empty">Заказов пока нет</td></tr>')
        + '</tbody></table></div></div>';
      $('#kf').addEventListener('submit', async e => { e.preventDefault(); const b = e.target.querySelector('button'); b.disabled = true;
        try { const k = await K.api('admin', {body:{secret:pw, action:'keys', tariff:$('#kt').value, count:$('#kn').value}});
          $('#keys').innerHTML = '<div class="keybox" data-copy-root style="margin-top:1em"><code class="copy-src" style="font-size:1rem;white-space:pre-line">' + k.keys.join('\n') + '</code><button class="btn-copy" data-copy type="button">Скопировать</button></div>';
        } catch (x) { $('#keys').innerHTML = '<p class="err">' + esc(x.message) + '</p>'; } b.disabled = false; });
    } catch (x) { $('#auth').hidden = false; if (pw) $('#ae').textContent = x.message; }
  }
  $('#auth').addEventListener('submit', e => { e.preventDefault(); pw = $('#pw').value; load(); });
  if (pw) load();
})();
</script>
</body></html>
